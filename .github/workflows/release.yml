name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build installer
        run: npm run dist -- --publish never

      - name: Normalize release asset names
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          Copy-Item -LiteralPath "release\Time Logger Setup $version.exe" -Destination "release\Time-Logger-Setup-$version.exe" -Force
          Copy-Item -LiteralPath "release\Time Logger Setup $version.exe.blockmap" -Destination "release\Time-Logger-Setup-$version.exe.blockmap" -Force

      - name: Publish release assets
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          gh release create "v$version" `
            --title "$version" `
            --notes-file "electron/release-notes.md" `
            --target "$env:GITHUB_SHA" `
            --latest
          gh release upload "v$version" `
            "release\Time-Logger-Setup-$version.exe" `
            "release\Time-Logger-Setup-$version.exe.blockmap" `
            "release\latest.yml" `
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
